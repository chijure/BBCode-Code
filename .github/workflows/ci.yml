name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - run: npx --yes @vscode/vsce@3 package --out bbcode.vsix
      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: bbcode.vsix

  publish:
    # Se publica al subir un tag vX.Y.Z que coincida con la versión de package.json.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    env:
      OVSX_PAT: ${{ secrets.OVSX_PAT }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar versión
        run: |
          PKG_VERSION="v$(node -p "require('./package.json').version")"
          if [ "$PKG_VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "El tag $GITHUB_REF_NAME no coincide con package.json ($PKG_VERSION)"
            exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          name: vsix
      - name: Publicar en VS Code Marketplace
        run: npx --yes @vscode/vsce@3 publish --packagePath bbcode.vsix
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
      - name: Publicar en Open VSX
        if: env.OVSX_PAT != ''
        run: npx --yes ovsx@0.10 publish bbcode.vsix
